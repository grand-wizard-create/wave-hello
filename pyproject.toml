[project]
name = "wave-hello"
version = "0.1.0"
description = "Your arm waves hello, then folds back to rest. A gentle first app."
requires-python = ">=3.12"
dependencies = ["monorobot"]

[tool.monorobot]
author = "grand-wizard-create"
description = "Your arm waves hello, then folds back to rest. A gentle first app."
license = "Apache-2.0"
network = false
whats_new = "First version."

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
